services:
  dev:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: learnable-resizer:latest
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /workspace
    volumes:
      - ..:/workspace
    environment:
      - PYTHONPATH=/workspace/src
      - TORCH_HOME=/workspace/.cache/torch
      - MPLCONFIGDIR=/tmp/matplotlib
      - HOME=/tmp
    shm_size: "8gb"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  tensorboard:
    image: learnable-resizer:latest
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /workspace
    volumes:
      - ..:/workspace
    environment:
      - HOME=/tmp
    ports:
      - "6006:6006"
    command: tensorboard --logdir outputs --bind_all --port 6006
